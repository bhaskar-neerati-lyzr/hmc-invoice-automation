services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: outlook_invoices
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Also runs outlook/worker.py's SQS-consumer loop, embedded as a
  # background thread started from main.py's lifespan (see that file) -
  # not a separate service/container, so there are 2 ECS services in
  # production (this + frontend), not 3. Needs real AWS credentials with
  # SQS access, sourced from the host environment (aws configure /
  # AWS_PROFILE) - for local dev without a real AWS account, see
  # docker-compose.dev.yml's LocalStack service.
  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever DATABASE_URL is in backend/.env (that one's for
      # running the backend directly on the host) - inside compose, the DB
      # is reachable at the service name "db", not localhost.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/outlook_invoices
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        # Baked into the browser bundle at build time - see frontend/Dockerfile.
        # Override in .env for anything other than local single-host use.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
